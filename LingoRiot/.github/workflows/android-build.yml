name: LingoRiot Android Build (Unzip + Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      zip_filename:
        description: 'نام فایل زیپ در ریشه مخزن (اختیاری). اگر خالی باشد از سورس مستقیم استفاده می‌شود.'
        required: false
        default: ''

jobs:
  build:
    name: Unzip & Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------- اگر زیپ وجود داشته باشد آن را باز کن ----------
      - name: Detect and unzip project zip
        id: unzip
        run: |
          set -e
          ZIP_NAME="${{ github.event.inputs.zip_filename }}"
          
          # اگر کاربر نامی نداده، زیپ‌های رایج را جستجو کن
          if [ -z "$ZIP_NAME" ]; then
            if [ -f "LingoRiot-source.zip" ]; then
              ZIP_NAME="LingoRiot-source.zip"
            elif [ -f "LingoRiot.zip" ]; then
              ZIP_NAME="LingoRiot.zip"
            elif ls *.zip 1> /dev/null 2>&1; then
              ZIP_NAME=$(ls *.zip | head -1)
            fi
          fi

          if [ -n "$ZIP_NAME" ] && [ -f "$ZIP_NAME" ]; then
            echo "Found zip: $ZIP_NAME – extracting..."
            rm -rf extracted
            mkdir -p extracted
            unzip -q "$ZIP_NAME" -d extracted
            
            # پیدا کردن پوشه واقعی پروژه
            if [ -d "extracted/LingoRiot" ]; then
              PROJECT_DIR="extracted/LingoRiot"
            elif [ -f "extracted/settings.gradle.kts" ] || [ -f "extracted/settings.gradle" ]; then
              PROJECT_DIR="extracted"
            else
              PROJECT_DIR=$(find extracted -name "settings.gradle*" -type f | head -1 | xargs dirname)
            fi
            
            echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_OUTPUT
            echo "Using extracted project at: $PROJECT_DIR"
            ls -la "$PROJECT_DIR"
          else
            echo "No zip found – building from checked-out source"
            echo "PROJECT_DIR=." >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            \~/.gradle/caches
            \~/.gradle/wrapper
          key: gradle-\( {{ runner.os }}- \){{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make sure we are in project directory
        working-directory: ${{ steps.unzip.outputs.PROJECT_DIR }}
        run: |
          echo "Current dir: $(pwd)"
          ls -la
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found – generating wrapper..."
            sudo apt-get update -qq && sudo apt-get install -y -qq wget unzip > /dev/null
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
            chmod +x gradlew
          else
            chmod +x gradlew
          fi

      - name: Run unit tests
        working-directory: ${{ steps.unzip.outputs.PROJECT_DIR }}
        continue-on-error: true
        run: |
          ./gradlew test --stacktrace --no-daemon || echo "Unit tests finished with issues (continue)"

      - name: Build debug APK
        working-directory: ${{ steps.unzip.outputs.PROJECT_DIR }}
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate APK
        id: find_apk
        working-directory: ${{ steps.unzip.outputs.PROJECT_DIR }}
        run: |
          APK_PATH=$(find . -name "*.apk" -path "*/debug/*" | head -1)
          if [ -z "$APK_PATH" ]; then
            APK_PATH=$(find . -name "*.apk" | head -1)
          fi
          echo "APK_PATH=$APK_PATH" >> $GITHUB_OUTPUT
          echo "Found APK: $APK_PATH"
          ls -lh "$APK_PATH" || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LingoRiot-debug-apk
          path: \( {{ steps.unzip.outputs.PROJECT_DIR }}/ \){{ steps.find_apk.outputs.APK_PATH }}
          retention-days: 30
          if-no-files-found: warn

      - name: Build summary
        if: always()
        run: |
          echo "### LingoRiot Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- Project dir: \`${{ steps.unzip.outputs.PROJECT_DIR }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`${{ steps.find_apk.outputs.APK_PATH }}\`" >> $GITHUB_STEP_SUMMARY
