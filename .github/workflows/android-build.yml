name: Build Thug Life APK from zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Unzip the project
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "::error::No .zip file found in the repository root"; exit 1; fi
          echo "Using ${zips[0]}"
          mkdir -p "$RUNNER_TEMP/src"
          unzip -q "${zips[0]}" -d "$RUNNER_TEMP/src"
          PROJECT=$(dirname "$(find "$RUNNER_TEMP/src" -name settings.gradle.kts -not -path '*/node_modules/*' | head -n 1)")
          if [ -z "$PROJECT" ] || [ "$PROJECT" = "." ]; then echo "::error::settings.gradle.kts not found inside the zip"; exit 1; fi
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          ls "$PROJECT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate bundled curriculum
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/validate_content.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Visible but non-blocking: a failing test shows a warning and uploads the report, but the APK is still built.
      - name: Unit tests
        id: tests
        continue-on-error: true
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
      - name: Report test result
        if: steps.tests.outcome == 'failure'
        run: echo "::warning::Unit tests FAILED - see the unit-test-reports artifact. The APK below was still built."

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Check APK exists
        run: |
          ls -l "$PROJECT_DIR/app/build/outputs/apk/debug/"
          test -s "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thug-life-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
