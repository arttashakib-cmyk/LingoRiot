name: LingoRiot Android Build (Unzip + Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Unzip Zip → Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project and flatten all files
        id: unzip
        run: |
          set -e
          echo "=== Searching for zip file ==="
          ls -la

          ZIP_FILE=""
          if [ -f "LingoRiot-source.zip" ]; then
            ZIP_FILE="LingoRiot-source.zip"
          elif [ -f "LingoRiot.zip" ]; then
            ZIP_FILE="LingoRiot.zip"
          else
            ZIP_FILE=$(find . -maxdepth 1 -name "*.zip" -type f | head -1)
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "No zip file found. Trying existing source..."
            if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
              echo "PROJECT_DIR=." >> $GITHUB_OUTPUT
              exit 0
            else
              echo "ERROR: Neither zip nor source found!"
              exit 1
            fi
          fi

          echo "Found zip: $ZIP_FILE"
          rm -rf extracted _project_tmp
          mkdir -p extracted
          unzip -o -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -name "settings.gradle.kts" -o -name "settings.gradle" | head -1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts not found inside zip!"
            find extracted -type f | head -50
            exit 1
          fi

          PROJECT_ROOT=$(dirname "$SETTINGS_FILE")
          echo "Real project root: $PROJECT_ROOT"

          mkdir -p _project_tmp
          cp -a "$PROJECT_ROOT"/. _project_tmp/

          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '*.zip' ! -name '_project_tmp' -exec rm -rf {} +
          cp -a _project_tmp/. .
          rm -rf _project_tmp extracted

          ls -la
          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts missing after flatten!"
            exit 1
          fi
          echo "PROJECT_DIR=." >> $GITHUB_OUTPUT
          echo "✅ Unzip completed"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Ensure Gradle Wrapper exists
        run: |
          set -e
          if [ ! -f "./gradlew" ]; then
            echo "Generating gradlew..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq wget unzip > /dev/null
            wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /tmp
            /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Run unit tests
        continue-on-error: true
        run: ./gradlew test --stacktrace --no-daemon || true

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find and upload APK
        id: apk
        run: |
          set -e
          APK=$(find . -name "*.apk" -path "*/outputs/apk/debug/*" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: No APK found!"
            find . -name "*.apk" || true
            exit 1
          fi
          echo "Found APK: $APK"
          ls -lh "$APK"
          echo "APK_PATH=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LingoRiot-debug-apk
          path: ${{ steps.apk.outputs.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
