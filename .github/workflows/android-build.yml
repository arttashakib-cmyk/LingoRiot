name: LingoRiot Android Build (Unzip + Build)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lingoriot-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip Zip → Build APK
    # استفاده از اوبونتو 22.04 برای پایداری بیشتر در بیلدهای اندروید
    runs-on: ubuntu-22.04
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP if present
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' -print -quit || true)"
          if [ -n "${ZIP:-}" ]; then
            echo "Found archive: $ZIP -> extracting into ./extracted"
            mkdir -p extracted
            unzip -q -o "$ZIP" -d extracted
            echo "Extracted contents:"
            ls -la extracted
            if [ -d extracted/LingoRiot ] && [ -f extracted/LingoRiot/settings.gradle.kts ]; then
              echo "Moving LingoRiot/ contents to extracted/"
              shopt -s dotglob
              mv extracted/LingoRiot/* extracted/ 2>/dev/null || true
              rmdir extracted/LingoRiot 2>/dev/null || true
            fi
          else
            echo "No ZIP archive found; using repository files as-is."
          fi

      - name: Locate Gradle project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "./settings.gradle.kts" ] && [ -d "./app" ]; then
            DIR="."
          elif [ -f "./LingoRiot/settings.gradle.kts" ]; then
            DIR="LingoRiot"
          elif [ -f "./extracted/settings.gradle.kts" ]; then
            DIR="extracted"
          else
            CAND="$(find . -maxdepth 5 -name settings.gradle.kts -not -path './.git/*' -print -quit || true)"
            if [ -n "${CAND:-}" ]; then
              DIR="$(dirname "$CAND")"
            else
              DIR=""
            fi
          fi

          if [ -z "${DIR:-}" ] || [ ! -f "$DIR/settings.gradle.kts" ]; then
            echo "::error::settings.gradle.kts not found."
            exit 1
          fi
          echo "Using project directory: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_HOME="$HOME/android-sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH" >> "$GITHUB_ENV"

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -sL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip
          mv cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          export ANDROID_HOME="$ANDROID_HOME"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "platforms;android-34" "build-tools;34.0.0"
          echo "SDK installed."

      - name: Fix AAPT2 permissions
        shell: bash
        run: |
          # این استپ بسیار مهم است؛ گاهی اوقات AAPT2 در رانرهای لینوکسی دسترسی اجرا ندارد
          chmod -R +x $ANDROID_HOME/build-tools/

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare Gradle wrapper and properties
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ] || [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9 --no-daemon
          fi
          test -f gradlew || { echo "::error::gradlew missing"; exit 1; }
          chmod +x gradlew
          
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
          
          if [ ! -f gradle.properties ]; then touch gradle.properties; fi
          if ! grep -q "org.gradle.jvmargs" gradle.properties; then
            echo "org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8" >> gradle.properties
          fi
          echo "Updated gradle.properties:"
          cat gradle.properties

      - name: Ensure debug keystore directory is writable
        shell: bash
        run: |
          mkdir -p $HOME/.android
          chmod 777 $HOME/.android

      # موقتاً غیرفعال شد تا خطای اصلی بیلد مشخص شود
      # - name: Unit tests
      #   working-directory: ${{ env.PROJECT_DIR }}
      #   shell: bash
      #   continue-on-error: true
      #   run: |
      #     set -o pipefail
      #     ./gradlew --no-daemon --stacktrace testDebugUnitTest 2>&1 | tee unit-tests.log || true

      - name: Clean and Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set +e # اجازه می‌دهیم حتی در صورت خطا، مراحل بعدی برای دیباگ اجرا شوند
          
          echo "::group::Gradle Clean"
          ./gradlew clean --no-daemon
          echo "::endgroup::"

          echo "::group::Gradle Assemble Debug"
          ./gradlew --no-daemon --stacktrace assembleDebug 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "::endgroup::"

          # اگر بیلد فیل شد، لاگ کامل را چاپ کن تا خطا را ببینیم
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "::error::Build failed with exit code $BUILD_EXIT_CODE"
            echo "===== FULL BUILD LOG ====="
            cat build.log
            echo "=========================="
            exit 1
          fi

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(ls app/build/outputs/apk/debug/*.apk | head -n 1)"
          test -s "$APK" || { echo "::error::APK missing or empty"; exit 1; }
          cp "$APK" LingoRiot-debug.apk
          ls -lh LingoRiot-debug.apk
          echo "APK size: $(stat -c%s LingoRiot-debug.apk) bytes"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LingoRiot-debug-apk
          path: ${{ env.PROJECT_DIR }}/LingoRiot-debug.apk
          if-no-files-found: error

      - name: Upload logs and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LingoRiot-build-logs
          path: |
            ${{ env.PROJECT_DIR }}/*.log
            ${{ env.PROJECT_DIR }}/app/build/reports/tests
            ${{ env.PROJECT_DIR }}/app/build/test-results
          if-no-files-found: ignore
